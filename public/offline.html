<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KharchGini — offline</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #fbfaf7;
        color: #1f1c19;
        font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 24rem; text-align: center; }
      img { width: 56px; height: 56px; margin-bottom: 1.25rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 0.875rem; color: #6b6459; }
      button {
        margin-top: 1.5rem;
        height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #1d8660;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16150f; color: #f0ece3; }
        p { color: #a29a8c; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>No connection</h1>
      <p>
        KharchGini could not load its files. Anything you have already recorded is
        safe — it is stored on this device and will sync the moment you are back
        online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
