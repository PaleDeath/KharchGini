<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KharchGini">
  <!--
    One glyph, no wordmark. At 48px on a home screen a wordmark is a smudge,
    and the rupee sign already says everything the app is about.

    The safe zone matters: Android crops maskable icons to a circle of 80% the
    width, so the glyph is kept well inside a 25.6px radius from the centre.
  -->
  <rect width="64" height="64" rx="14" fill="#1d8660"/>
  <g transform="translate(14 14) scale(1.5)"
     fill="none" stroke="#ffffff" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12"/>
    <path d="M6 8h12"/>
    <path d="M6 13h3"/>
    <path d="M9 13c6.667 0 6.667-10 0-10"/>
    <path d="M6 13l8.5 8"/>
  </g>
</svg>
